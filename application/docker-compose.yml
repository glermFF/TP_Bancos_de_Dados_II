version: '3.8'

services: 
  neo4j:
    image: neo4j:5
    container_name: adegaDB
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/senha123
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/var/lib/neo4j/import
  
  backend:
    build:
      context: ./app-backend
      dockerfile: back.dockerfile
    container_name: adegaBackend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=senha123
    volumes:
      - ./app-backend:/app 
      - /app/node_modules 
    depends_on:
      - neo4j

  frontend:
    build:
      context: ./app-frontend
      dockerfile: front.dockerfile
    container_name: adegaFrontend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - EXPO_PACKAGER_PROXY_URL=http://localhost:8081
    volumes:
      - ./app-frontend:/app 
      - /app/node_modules 
    depends_on:
      - backend