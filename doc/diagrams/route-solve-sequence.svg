<line class="lifeline" data-actor="API" x1="464.9694999999999" y1="70" x2="464.9694999999999" y2="710" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Svc" x1="654.886" y1="70" x2="654.886" y2="710" stroke="var(--_line)" stroke-width="0.75" stroke-dasharray="6 4" />
