  <rect x="191" y="32" width="595.674" height="28" rx="0" ry="0" fill="var(--_group-hdr)" stroke="var(--_node-stroke)" stroke-width="1" />
  <text x="203" y="46" font-size="12" font-weight="600" fill="var(--_text-sec)" dy="4.199999999999999">Cachaceiro Viajante</text>
